<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>test_serv</title>
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
  <header>
    <h1>test_serv</h1>
    <div class="status">
      <span id="poll-status" class="poll-ok">poll: --</span>
      <button id="refresh-now" type="button" title="Re-fetch /devices and /ops from the server. Cheap; no bench work. Shows the latest snapshot the poller has pushed.">refresh now</button>
      <button id="run-inventory" type="button" title="POST /sweep + run an `inventory` plan. Forces the poller to re-probe USB and identity-verify every device, then push fresh status. Slower; actually exercises the bench. Use after plug/unplug.">run inventory</button>
    </div>
  </header>

  <section id="devices-section">
    <h2>Devices</h2>
    <table id="devices-table">
      <thead>
        <tr>
          <th>id</th>
          <th>plugin</th>
          <th>location</th>
          <th>verify</th>
          <th>latency</th>
          <th title="open = a job is using the device right now; cached = handle stays in registry until session end; closed = no handle held">handle</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div id="devices-empty" class="empty hidden">no devices reported</div>
  </section>

  <section id="jobs-section">
    <h2>Jobs
      <button id="prune-jobs" type="button" class="header-btn"
              title="Remove every 'running' entry whose artefact is no longer on the server. These are leftovers: the poller picked the job up, the agent fetched + deleted the artefact, but the bookkeeping record stayed. Does NOT touch queued or done jobs.">clear stale</button>
      <button id="wipe-jobs" type="button" class="header-btn header-btn-danger"
              title="Wipe everything: queued plans, running records, all artefacts. NOT a force-cancel -- a currently-running session will still post its artefact, which will reappear as a fresh 'done' entry.">delete all</button>
    </h2>
    <table id="jobs-table">
      <thead>
        <tr>
          <th>digest</th>
          <th>status</th>
          <th>when</th>
          <th>size</th>
          <th>actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div id="jobs-empty" class="empty">no jobs known to server</div>
  </section>

  <section id="ops-section">
    <h2 title="Per-plugin op catalog: every verb you can write in a plan, with arg types + docs.">Ops</h2>
    <div id="ops-catalog"></div>
  </section>

  <section id="submit-section">
    <h2>Submit a plan</h2>
    <p class="hint">No-blob plans only. For blob attachments use submit.py / the REST API directly.</p>
    <div class="row">
      <label>load example
        <select id="example-picker" title="Load a bundled starter plan into the editor below.">
          <option value="">(choose one)</option>
        </select>
      </label>
    </div>
    <textarea id="plan-text" rows="8"
              placeholder='description "short summary of what this plan does"&#10;inventory&#10;# or any multi-op plan'></textarea>
    <div class="row">
      <label>X-Test-Runtime (s)
        <input id="meta-runtime" type="number" min="1" max="3600" placeholder="default: 600">
      </label>
      <label>X-Test-Upload-Timeout (s)
        <input id="meta-upload" type="number" min="1" max="3600" placeholder="default: 600">
      </label>
      <button id="submit-plan-btn" type="button">submit + wait</button>
    </div>
    <div id="submit-result"></div>
  </section>

  <script src="/web/app.js"></script>
</body>
</html>
